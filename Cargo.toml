[workspace]
members = ["crates/dsg-convert", "crates/station", "crates/tools", "crates/ygg-bridge"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Upstream Yggdrasil, unmodified (f32 positions).
scene-graph = { git = "https://github.com/brdsdsu/Yggdrasil", rev = "3b17a94c57f366fb30b04f1d939a21559797b2c1" }
serde_json = "1"
flate2 = "1"
dsg-convert = { path = "crates/dsg-convert" }
