[workspace]
members = ["crates/dsg-convert", "crates/tools", "crates/ygg-bridge"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Published Yggdrasil only; nothing in hydra-ygg patches it. Replace the path with the
# public git URL pinned to a commit, e.g.
# Public Yggdrasil, pinned. Bump rev deliberately.
scene-graph = { git = "https://github.com/brdsdsu/Yggdrasil", rev = "3b17a94c57f366fb30b04f1d939a21559797b2c1" }
serde_json = "1"
dsg-convert = { path = "crates/dsg-convert" }
